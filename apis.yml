- type: Features
  data:
  - name: Healthcare Data Normalization
    description: Universal translation across HL7v2, CDA, X12, DICOM, and HL7 FHIR R4 so vendors write
      one integration and reach any connected EHR or network.
  - name: 100+ EHR Connections
    description: Pre-built connectivity to Epic, Oracle Health/Cerner, MEDITECH, Athenahealth, eClinicalWorks,
      NextGen, Allscripts/Veradigm, and dozens of other EHRs.
  - name: Clinical Network Onramps
    description: Integrated access to Carequality, CommonWell, TEFCA, DirectTrust, and other clinical
      exchange networks through a single Redox connection.
  - name: Patient Identity (EMPI)
    description: Redox EMPI powered by Verato links patient records across disparate sources to support
      longitudinal patient views and matching.
  - name: Cloud Connectivity
    description: Direct ingestion onramps into AWS, Microsoft Azure, Google Cloud, Databricks, and Snowflake
      for analytics, ML, and warehouse use cases.
  - name: Data Operations
    description: Filters (allow/block rules), translation sets (value mappings), and config modifiers
      let teams customize processing logic without code deploys.
  - name: Subscriptions and Orchestration
    description: Event subscriptions and conditional routing govern how and when data moves across the
      connected ecosystem.
  - name: Bulk and Real-Time Delivery
    description: Real-time message streaming plus bulk and batch delivery modes to fit both transactional
      and analytics workloads.
  - name: Environments and Promotions
    description: Development, staging, and production environments with promotion workflows for safe configuration
      rollout.
  - name: HITRUST and SOC 2
    description: HITRUST r2 certified on AWS and GCP and SOC 2 Type 2 compliant security posture across
      the platform.
- type: UseCases
  data:
  - name: Digital Health EHR Integration
    description: Digital health startups embed Redox to reach hospital and clinic EHRs without building
      one-off interfaces per customer.
  - name: Patient Access and Engagement
    description: Patient-facing apps pull longitudinal records over FHIR and write encounter data back
      to provider EHRs.
  - name: Care Coordination and Discharge
    description: Providers exchange ADT, discharge, and referral messages with downstream partners in
      real time.
  - name: Population Health and Registries
    description: Aggregate clinical data across networks for registry submission, public health reporting,
      and population analytics.
  - name: Payer Data Exchange
    description: Payers run prior authorization, HEDIS reporting, member data standardization, and care-gap
      workflows on top of Redox-mediated provider data.
  - name: Lab Order and Result Routing
    description: Labs and diagnostic vendors route orders and results bi-directionally across EHRs through
      standardized event types.
  - name: Medical Device Data Capture
    description: Device manufacturers stream telemetry and observations into EHR charts via the same integration
      surface.
  - name: EHR Migration and Conversion
    description: Health systems lift-and-shift between EHRs by replaying historical data through Redox
      during cutover.
  - name: Life Sciences Real-World Data
    description: Pharma and life sciences teams pull de-identified real-world data for clinical research
      and post-market surveillance.
  - name: Cloud Data Warehouse Hydration
    description: Hydrate Snowflake, Databricks, BigQuery, S3, and Azure data lakes with normalized clinical
      data for analytics and ML.
- type: Integrations
  data:
  - name: Epic
    description: Bi-directional connectivity to Epic EHR for clinical, ADT, scheduling, orders, and results
      workflows.
  - name: Oracle Health (Cerner)
    description: Connection to Oracle Health Millennium for FHIR, HL7v2, and Data Model traffic.
  - name: MEDITECH
    description: Integration with MEDITECH Expanse and MAGIC for ambulatory and acute care data exchange.
  - name: Athenahealth
    description: Connectivity to athenaOne for ambulatory and revenue-cycle workflows.
  - name: eClinicalWorks
    description: Integration with eClinicalWorks ambulatory EHR.
  - name: NextGen Healthcare
    description: Connection to NextGen ambulatory EHR.
  - name: Allscripts (Veradigm)
    description: Integration with Veradigm/Allscripts ambulatory and acute EHRs.
  - name: Carequality
    description: Onramp to the Carequality national interoperability framework for document and FHIR exchange.
  - name: CommonWell Health Alliance
    description: Onramp to the CommonWell network for cross-vendor patient record exchange.
  - name: TEFCA
    description: Connectivity to the Trusted Exchange Framework and Common Agreement (TEFCA) network.
  - name: DirectTrust
    description: Secure Direct messaging through the DirectTrust network.
  - name: Verato EMPI
    description: Redox EMPI powered by Verato for enterprise master patient indexing and identity resolution.
  - name: IMO
    description: IMO codeset normalization for diagnosis and procedure terminology.
  - name: AWS
    description: Direct cloud connectivity into Amazon Web Services accounts and AWS Marketplace listing.
  - name: Microsoft Azure
    description: Cloud connectivity into Microsoft Azure and Azure Marketplace listing.
  - name: Google Cloud
    description: Cloud connectivity into Google Cloud Platform and GCP Marketplace listing.
  - name: Snowflake
    description: Native onramp into Snowflake for clinical data warehousing.
  - name: Databricks
    description: Native onramp into Databricks for healthcare lakehouse and AI workloads.
- type: Solutions
  data:
  - name: Vendors
    description: Connect digital health products to providers and payers, integrate with EHR systems,
      and access clinical networks through a single API.
  - name: Providers
    description: Real-time data exchange for discharge coordination, infection risk detection, capacity
      management, registry submission, payer data exchange, lab order routing, and EHR migration.
  - name: Payers
    description: HEDIS reporting, member data standardization, care gap identification, and prior authorization
      workflows powered by provider-sourced clinical data.
  - name: EHRs
    description: EHR vendors expose modern API surfaces to their ecosystems through Redox-mediated integration
      tooling.
  - name: Life Sciences
    description: Real-world data acquisition, clinical trial recruitment, and post-market surveillance
      built on top of normalized healthcare data.
