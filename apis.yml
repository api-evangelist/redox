aid: redox
name: Redox
description: Redox is a healthcare data interoperability platform, founded in 2014 and headquartered in
  Madison, Wisconsin, that enables secure, real-time exchange of clinical and administrative data across
  the healthcare ecosystem. Through a single API and a network of 100+ EHR connections and 12,000+ connected
  healthcare organizations, Redox lets digital health vendors, providers, payers, EHRs, and life-sciences
  companies integrate once and reach the entire network. The platform offers a modern FHIR API, the legacy
  Redox Data Model (Redox Messages) event-based API, and a Platform API for managing organizations, sources,
  and destinations. Redox is HITRUST r2 and SOC 2 Type 2 certified and HIPAA, GDPR, and CCPA aligned,
  processing tens of billions of healthcare transactions annually.
