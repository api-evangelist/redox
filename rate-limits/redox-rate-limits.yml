limits:
- scope: per-account (by source IP address)
  window: rolling 5 minutes
  limit: 10000
  unit: requests
  notes: >-
    Standard rate limit across the Redox APIs: up to 10,000 requests every five minutes per
    user, as determined by IP address. The five-minute window is rolling, not fixed — a client
    that trips the limit only has to wait until the original window elapses, not a full five
    minutes from the error.
- scope: per-account, lowered for specific tooling
  window: rolling 5 minutes
  limit: 5
  unit: requests
  notes: >-
    Lower rate limit applied to DevTools requests specifically (5 requests per 5 minutes),
    for security reasons. Same 429 handling and guidance applies.
