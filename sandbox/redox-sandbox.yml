source: https://docs.redoxengine.com/how-to-use-redox/test-with-redox-fhir-sandbox-data/
summary: >-
  Redox operates a full-featured FHIR sandbox seeded with synthetic test patients (partly
  generated from the open-source Synthea dataset) covering most FHIR resources in the API
  suite, supporting reads, queries, and writebacks. The sandbox is periodically refreshed back
  to its Redox-seeded state to keep test data valuable and to clear any confidential data
  customers may have written into it.
destination_slug: redox-fhir-sandbox
environments:
- Development
- Staging
- Production
environments_ref: authentication/redox-authentication.yml
search_identifiers:
  matching: exact match only
  identifier_types:
  - {type: MR, system: "http://.../Redox FHIR API sandbox environment (Medical Record ID)"}
  - {type: DL, name: "Driver's license number"}
  - {type: PPN, name: "Passport number"}
  - {type: SSN, system: "http://hl7.org/fhir/sid/us-ssn"}
  demographic_params:
  - given name
  - family name
  - gender
  - birthdate
  - address-city
  - address-state
  - address-postalcode
  - phone (matches home or mobile)
  - email address
  notes: The sandbox does not support searching by street address; use city/state/postal code instead.
